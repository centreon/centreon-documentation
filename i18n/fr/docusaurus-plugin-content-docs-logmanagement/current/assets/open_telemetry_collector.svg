<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Dark navy background -->
  <rect width="680" height="360" rx="16" fill="#0D1B3E"/>

  <!-- Source host outer container -->
  <rect x="16" y="16" width="510" height="328" rx="14" fill="none" stroke="#5B8DD9" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#A8C8F8" x="32" y="38" dominant-baseline="central">Source host</text>

  <!-- Left blocks -->
  <rect x="28" y="118" width="96" height="36" rx="6" fill="#CBD8F0" stroke="#5B8DD9" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#1A2E5A" x="76" y="136" text-anchor="middle" dominant-baseline="central">App / service</text>

  <rect x="28" y="166" width="96" height="36" rx="6" fill="#CBD8F0" stroke="#5B8DD9" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" fill="#1A2E5A" x="76" y="184" text-anchor="middle" dominant-baseline="central">OS / infra</text>

  <rect x="28" y="214" width="96" height="36" rx="6" fill="#CBD8F0" stroke="#5B8DD9" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="11" font-weight="700" fill="#1A2E5A" x="76" y="232" text-anchor="middle" dominant-baseline="central">...</text>

  <!-- Arrows from left blocks to center of Receivers (x=162, y=184) -->
  <path d="M124 136 L162 184" fill="none" stroke="#7BC4FF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="124" y1="184" x2="162" y2="184" stroke="#7BC4FF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M124 232 L162 184" fill="none" stroke="#7BC4FF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- OTel Collector container -->
  <rect x="148" y="36" width="362" height="296" rx="12" fill="none" stroke="#7AAAF0" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#C8DEFF" x="329" y="62" text-anchor="middle" dominant-baseline="central">OpenTelemetry Collector</text>

  <!-- Receivers -->
  <rect x="162" y="108" width="92" height="152" rx="8" fill="#B8F0DC" stroke="#2DC99A" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#054530" x="208" y="126" text-anchor="middle" dominant-baseline="central">Receivers</text>
  <rect x="170" y="142" width="76" height="28" rx="5" fill="#7EEAC8" stroke="#2DC99A" stroke-width="0.6"/>
  <text font-family="sans-serif" font-size="11" fill="#043A28" x="208" y="156" text-anchor="middle" dominant-baseline="central">OTLP</text>
  <rect x="170" y="178" width="76" height="28" rx="5" fill="#7EEAC8" stroke="#2DC99A" stroke-width="0.6"/>
  <text font-family="sans-serif" font-size="11" fill="#043A28" x="208" y="192" text-anchor="middle" dominant-baseline="central">Syslog</text>
  <rect x="170" y="214" width="76" height="28" rx="5" fill="#7EEAC8" stroke="#2DC99A" stroke-width="0.6"/>
  <text font-family="sans-serif" font-size="11" fill="#043A28" x="208" y="228" text-anchor="middle" dominant-baseline="central">Filelog</text>

  <!-- Arrow receivers → processors -->
  <line x1="254" y1="184" x2="274" y2="184" stroke="#7BC4FF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Processors -->
  <rect x="276" y="108" width="92" height="152" rx="8" fill="#D8D2FF" stroke="#7B6FFF" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#1E1860" x="322" y="126" text-anchor="middle" dominant-baseline="central">Processors</text>
  <rect x="284" y="142" width="76" height="28" rx="5" fill="#BCB4FF" stroke="#7B6FFF" stroke-width="0.6"/>
  <text font-family="sans-serif" font-size="11" fill="#1A1550" x="322" y="156" text-anchor="middle" dominant-baseline="central">Filter</text>
  <rect x="284" y="178" width="76" height="28" rx="5" fill="#BCB4FF" stroke="#7B6FFF" stroke-width="0.6"/>
  <text font-family="sans-serif" font-size="11" fill="#1A1550" x="322" y="192" text-anchor="middle" dominant-baseline="central">Transform</text>
  <rect x="284" y="214" width="76" height="28" rx="5" fill="#BCB4FF" stroke="#7B6FFF" stroke-width="0.6"/>
  <text font-family="sans-serif" font-size="11" fill="#1A1550" x="322" y="228" text-anchor="middle" dominant-baseline="central">Batch</text>

  <!-- Arrow processors → exporters -->
  <line x1="368" y1="184" x2="388" y2="184" stroke="#7BC4FF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Exporters -->
  <rect x="390" y="108" width="104" height="152" rx="8" fill="#B8F0DC" stroke="#2DC99A" stroke-width="0.8"/>
  <text font-family="sans-serif" font-size="13" font-weight="500" fill="#054530" x="442" y="126" text-anchor="middle" dominant-baseline="central">Exporters</text>
  <rect x="398" y="142" width="88" height="28" rx="5" fill="#7EEAC8" stroke="#2DC99A" stroke-width="0.6"/>
  <text font-family="sans-serif" font-size="11" fill="#043A28" x="442" y="156" text-anchor="middle" dominant-baseline="central">OTLP/HTTP</text>
  <rect x="398" y="178" width="88" height="28" rx="5" fill="#7EEAC8" stroke="#2DC99A" stroke-width="0.6"/>
  <text font-family="sans-serif" font-size="11" fill="#043A28" x="442" y="192" text-anchor="middle" dominant-baseline="central">Debug</text>

  <!-- Arrow exporters → CLM -->
  <line x1="494" y1="184" x2="540" y2="184" stroke="#7BC4FF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Centreon Log Management -->
  <rect x="542" y="146" width="122" height="76" rx="10" fill="#C4DEFF" stroke="#5B9EF0" stroke-width="1"/>
  <text font-family="sans-serif" font-size="12" font-weight="500" fill="#0C2D5E" x="603" y="174" text-anchor="middle" dominant-baseline="central">Centreon Log</text>
  <text font-family="sans-serif" font-size="12" font-weight="500" fill="#0C2D5E" x="603" y="194" text-anchor="middle" dominant-baseline="central">Management</text>
</svg>