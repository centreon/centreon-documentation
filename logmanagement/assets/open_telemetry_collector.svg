<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="320" fill="white"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Source host (outer container) -->
  <rect x="20" y="20" width="480" height="280" rx="16" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="44" y="48" dominant-baseline="central">Source host</text>
  <rect x="36" y="119" width="90" height="36" rx="6" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" fill="#2C2C2A" x="81" y="137" text-anchor="middle" dominant-baseline="central">App / service</text>
  <rect x="36" y="165" width="90" height="36" rx="6" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" fill="#2C2C2A" x="81" y="183" text-anchor="middle" dominant-baseline="central">OS / infra</text>

  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="81" y="215" text-anchor="middle" dominant-baseline="central">...</text>

  <!-- OTel Collector box -->
  <rect x="155" y="40" width="330" height="240" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C" x="320" y="68" text-anchor="middle" dominant-baseline="central">OpenTelemetry Collector</text>

  <!-- Receivers -->
  <rect x="170" y="85" width="84" height="175" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C" x="212" y="108" text-anchor="middle" dominant-baseline="central">Receivers</text>
  <rect x="178" y="122" width="68" height="26" rx="5" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" fill="#04342C" x="212" y="135" text-anchor="middle" dominant-baseline="central">OTLP</text>
  <rect x="178" y="156" width="68" height="26" rx="5" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" fill="#04342C" x="212" y="169" text-anchor="middle" dominant-baseline="central">Syslog</text>
  <rect x="178" y="190" width="68" height="26" rx="5" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" fill="#04342C" x="212" y="203" text-anchor="middle" dominant-baseline="central">Filelog</text>

  <!-- Arrow receivers → processors -->
  <line x1="254" y1="172" x2="274" y2="172" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Processors -->
  <rect x="276" y="85" width="84" height="175" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#412402" x="318" y="108" text-anchor="middle" dominant-baseline="central">Processors</text>
  <rect x="284" y="122" width="68" height="26" rx="5" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" fill="#412402" x="318" y="135" text-anchor="middle" dominant-baseline="central">Filter</text>
  <rect x="284" y="156" width="68" height="26" rx="5" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" fill="#412402" x="318" y="169" text-anchor="middle" dominant-baseline="central">Transform</text>
  <rect x="284" y="190" width="68" height="26" rx="5" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" fill="#412402" x="318" y="203" text-anchor="middle" dominant-baseline="central">Batch</text>

  <!-- Arrow processors → exporters -->
  <line x1="360" y1="172" x2="380" y2="172" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Exporters -->
  <rect x="382" y="85" width="84" height="175" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C" x="424" y="108" text-anchor="middle" dominant-baseline="central">Exporters</text>
  <rect x="390" y="122" width="68" height="26" rx="5" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" fill="#4A1B0C" x="424" y="135" text-anchor="middle" dominant-baseline="central">OTLP/HTTP</text>
  <rect x="390" y="156" width="68" height="26" rx="5" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="12" fill="#4A1B0C" x="424" y="169" text-anchor="middle" dominant-baseline="central">Debug</text>

  <!-- Arrow exporters → CLM -->
  <line x1="466" y1="172" x2="538" y2="172" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Centreon Log Management -->
  <rect x="540" y="122" width="128" height="76" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53" x="604" y="152" text-anchor="middle" dominant-baseline="central">Centreon Log</text>
  <text font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53" x="604" y="172" text-anchor="middle" dominant-baseline="central">Management</text>

  <!-- Arrow host → receivers (avant-plan) -->
  <line x1="126" y1="160" x2="170" y2="160" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>