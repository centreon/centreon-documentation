# =============================================================================
#  Production deployment of the documentation (S3 + CloudFront).
#
#  Push a v* tag on the validated commit: this workflow builds that commit
#  (indexable, base "/") and syncs it DIRECTLY to the root of the prod bucket,
#  then invalidates CloudFront.
#
#    git tag v1.0.0 && git push origin v1.0.0
#
#  The deploy job declares `environment: prod`, which only accepts v* tags
#  (centreon/Github): the gha-websites-docs-deploy role (Infrastructure,
#  stacks/websites, site docs) trusts repo:centreon/centreon-documentation:
#  environment:prod and this workflow name only.
#
#  Variables of the GitHub environment `prod` (centreon/Github):
#    vars.AWS_REGION  vars.S3_BUCKET  vars.CLOUDFRONT_DISTRIBUTION
# =============================================================================
# The name is part of the gha-websites-docs-deploy trust (token claim "workflow"): keep it "deploy-prod".
name: deploy-prod

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # One job per locale, in parallel: `--locale en` writes build/, `--locale fr`
  # writes build/fr/, so the deploy job only has to merge both artifacts.
  # No rspack cache here: a release is always built from scratch.
  # The staging site of docs-sites.sh: every version of versions.json except
  # the next one, which is not released yet.
  build:
    # GitHub-hosted: only the jobs that reach AWS run on the self-hosted
    # documentation runners.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        locale: [en, fr]
    name: Build ${{ matrix.locale }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # showLastUpdateTime needs the full history (commits and trees),
          # not the content of old files: a blobless clone is much faster.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install \
            --frozen-lockfile \
            --config.trustPolicy=no-downgrade \
            --config.minimumReleaseAge=2880 \
            --config.blockExoticSubdeps=true

      - name: Choose the versions
        id: versions
        run: bash .github/scripts/docs-sites.sh
        env:
          EVENT_NAME: ${{ github.event_name }}

      - name: Build documentation
        run: pnpm build --locale ${{ matrix.locale }}
        env:
          NODE_OPTIONS: --max_old_space_size=16000
          VERSIONS: ${{ steps.versions.outputs.staging_versions }}
          # Same output, faster build (opt-in flags of docusaurus.config.js).
          DOCUSAURUS_MDX_CROSS_COMPILER_CACHE: "1"
          DOCUSAURUS_SSG_WORKER_THREADS: "1"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-build-${{ matrix.locale }}
          path: build/
          retention-days: 1
          # Mostly images and minified files: compression gains little.
          compression-level: 1

  deploy:
    needs: [build]
    runs-on: documentation
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      BUCKET: ${{ vars.S3_BUCKET }}
      DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION }}
    steps:
      # The sync script only. Before the downloads: checkout cleans the
      # workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # en at the root of build/, fr under build/fr/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docs-build-*
          path: build
          merge-multiple: true

      # Environment prod only: the role trust refuses any other subject.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::557735569192:role/gha-websites-docs-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Cache and content type of each kind of file: see the script.
      - name: Sync the site
        shell: bash
        run: |
          set -euo pipefail
          : "${BUCKET:?}"
          bash .github/scripts/sync-site.sh ./build "s3://${BUCKET}/"

      - name: Invalidate the cache
        run: aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION}" --paths '/*'
