# =============================================================================
#  Production deployment of the documentation (S3 + CloudFront).
#
#  Push a v* tag on the validated commit: this workflow builds that commit
#  (indexable, base "/") and syncs it DIRECTLY to the root of the prod bucket,
#  then invalidates CloudFront. No branch prefix, no meta.json, no previews
#  page (unlike deploy-dev.yml).
#
#    git tag v1.0.0 && git push origin v1.0.0
#
#  The gha-docs-prod role (centreon/infra-security) trusts v* tags of this
#  repository and this workflow name only.
#
#  Repository variable: vars.DOCS_PROD_DISTRIBUTION_ID, CloudFront
#  distribution of the prod site (output cloudfront_distribution_ids.docs).
# =============================================================================
# The name is part of the gha-docs-prod trust (token claim "workflow"): keep it "deploy-prod".
name: deploy-prod

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: documentation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # showLastUpdateTime needs the full history
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install \
            --frozen-lockfile \
            --config.trustPolicy=no-downgrade \
            --config.minimumReleaseAge=2880 \
            --config.blockExoticSubdeps=true

      - name: Build documentation
        run: pnpm build
        env:
          NODE_OPTIONS: --max_old_space_size=16000

      # Tags v* only: the role trust refuses any other ref.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::557735569192:role/gha-docs-prod
          aws-region: eu-west-1

      # Hashed assets: long cache. Everything else is revalidated on each visit.
      - name: Sync the site
        run: |
          aws s3 sync ./build s3://docs-centreon-prod \
            --delete --exclude "*" --include "assets/*" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync ./build s3://docs-centreon-prod \
            --delete --exclude "assets/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate the cache
        env:
          DISTRIBUTION: ${{ vars.DOCS_PROD_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION}" --paths '/*'
