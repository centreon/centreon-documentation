name: archive

on:
  workflow_dispatch:
    inputs:
      version:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  build:
    needs: [dependency-scan]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2147483647 # full history of a single branch: https://git-scm.com/docs/shallow

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install \
            --frozen-lockfile \
            --config.trustPolicy=no-downgrade \
            --config.minimumReleaseAge=2880 \
            --config.blockExoticSubdeps=true
        shell: bash

      - name: Redirect pp and cloud links to last documentation
        run: |
          find versioned_docs versioned_sidebars -regex ".*\.\(md\|json\)" | xargs --delimiter='\n' sed -i 's#/cloud/#https://docs.centreon.com/cloud/#g'
          find versioned_docs versioned_sidebars -regex ".*\.\(md\|json\)" | xargs --delimiter='\n' sed -i 's#/pp/#https://docs.centreon.com/pp/#g'
        shell: bash

      - name: Build documentation for ${{ github.event.inputs.version }}
        run: ARCHIVED_VERSION="${{ github.event.inputs.version }}" pnpm build

      - name: Store build archived doc in cache
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            build
          key: "${{ github.sha }}-${{ github.run_id }}-build-archived-doc"

  publish:
    needs: [build]
    runs-on: infrastructure
    steps:
      - name: Restore built archived doc from cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            build
          key: "${{ github.sha }}-${{ github.run_id }}-build-archived-doc"
          fail-on-cache-miss: true

      - name: Setup awscli
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            sudo unzip -q awscliv2.zip
            sudo ./aws/install
          fi
        shell: bash

      - name: Copy to S3
        run: aws s3 sync --delete "build/" s3://centreon-documentation-archive/${{ github.event.inputs.version }}/
