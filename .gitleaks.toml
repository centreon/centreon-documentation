title = "Gitleaks custom rules"

[extend]
useDefault = true

[allowlist]
paths = [
  '''node_modules\/''',
  '''vendor\/''',
  '''(.*?)\.rptlibrary''',
  '''package\.json''',
  '''package-lock\.json''',
  '''composer\.json''',
  '''composer\.lock''',
  '''\.gitleaks\.toml$''',
  '''(.*?)(jpg|gif|doc|pdf|bin)$'''
]

regexTarget = "match"
regexes = [
  '''ABCDEFG1234567890''',
  '''deactivation/expiration/revocation''',
  '''78e64233e09d3d8ec7bf73c4d9ea8a8851badbd216''', # token example
  # Example values from the docs (API responses, public key thumbprints, placeholders), MON-212387.
  '''"USERNAME:API_KE''',
  '''12345abcd6789efg''',
  '''"NOM_UTILISATEUR''',
  '''vfDrmCjiXgoj2JrT''',
  '''NTc1MDU3MGE3M2Ji''',
  '''pnI6EWkiTbazjikJ''',
  '''8uT4BM1RsXRmIPQb''',
  '''nJSH9nZN2ugQeksH''',
  '''tRsFMBv9X3ScNFMw''',
  '''NmnPME43IoWpkQoa''',
  '''e40b1cc6\-f629\-43''',
  '''hooks\.slack\.com/services/X+/X+/X+''',
  '''elastic:centreon''',
  '''Np1wWwpbFD2I0Mde''',
  '''hwwE7w/ukiiMce2l''',
  '''x-api-key: (your|votre)_token''',
]
